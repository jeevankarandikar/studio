<!doctype html>
<!-- Personal-creator title: a day X/30 card, a title, and word-for-word captions
     (the captions live in project.json, beat-timed). The day number and the
     title line are placeholders; replace them with the day's real words. -->
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<body>
<div id="amb"></div>
<div id="card"></div>
<div id="title" class="abs h1" style="left:160px;top:300px;width:1500px">One day. One post.</div>
<div id="sub" class="abs sub" style="left:166px;top:560px;width:1300px">Same base: talking head, captions, day card.</div>
<script src="common.js"></script>
<script>
const day = card($('card'), { w: 360, h: 120, html: '<div class="sub" style="font-size:40px">day 1/30</div>' });
const titleW = splitWords($('title'));
const subW = splitWords($('sub'));
window.scene = {
  sfx: [{ t: 0.2, name: 'pop' }, { t: 0.8, name: 'tick', gain: 0.3 }, { t: 1.6, name: 'settle' }],
  render(t, f, ctx) {
    ambient($('amb'), t);
    pos(day, 160 + sp(t, 0.2, spring.snappy, -400, 0), 140, `scale(${sp(t, 0.2, spring.snappy, 0.9, 1)})`);
    day.style.opacity = clamp((t - 0.2) / 0.15);
    wordsIn(titleW, t, { delay: 0.8, step: 0.1, rise: 110 });
    wordsIn(subW, t, { delay: 1.6, step: 0.08, rise: 40, preset: spring.soft });
  },
};
</script>
