<!doctype html>
<!-- Silent-film storytelling: struggle hook, payoff-promising timestamp, transformation
     beat, readable on-screen text. Structure from the jun_yuh silent-film format: the
     film carries itself with no voiceover, the hook names the struggle, the timestamp
     promises the payoff, and the transformation is shown, not told. TURN_T assumes a
     6-beat scene at 120 bpm (3 seconds); move it to about 65% of the scene length
     if you change the beats. -->
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<body>
<div id="amb"></div>
<div id="hook" class="abs h1" style="left:160px;top:180px;width:1500px">This was the struggle.</div>
<div id="when" class="abs sub" style="left:166px;top:420px;width:1200px">Wait for the turn at the end.</div>
<canvas id="line" width="1200" height="60" style="position:absolute;left:166px;top:520px"></canvas>
<div id="before"></div>
<div id="after"></div>
<script src="common.js"></script>
<script>
const TURN_T = 2.0; // ~65% of a 3-second scene
const hookW = splitWords($('hook'));
const whenW = splitWords($('when'));
const before = card($('before'), { w: 700, h: 260, html: '<div class="sub" style="padding:36px">Before: stuck.</div>' });
const after = card($('after'), { w: 700, h: 260, html: '<div class="sub" style="padding:36px">After: moving.</div>' });
const g = $('line').getContext('2d');
window.scene = {
  sfx: [{ t: 0.2, name: 'pop' }, { t: TURN_T, name: 'settle' }],
  render(t, f, ctx) {
    ambient($('amb'), t);
    wordsIn(hookW, t, { delay: 0.2, step: 0.1, rise: 110 });
    wordsIn(whenW, t, { delay: 0.9, step: 0.08, rise: 40, preset: spring.soft });
    g.clearRect(0, 0, 1200, 60);
    brushStroke(g, [[0, 30], [400, 30], [800, 30], [1180, 30]], { progress: clamp(t / 1.4), width: 8, color: '#111', seed: 3 });
    // Transformation beat: the before card leaves as the after card arrives.
    pos(before, 160 + sp(t, TURN_T, spring.snappy, 0, -900), 640);
    before.style.opacity = 1 - clamp((t - TURN_T) / 0.2);
    pos(after, 160 + sp(t, TURN_T, spring.bouncy, 900, 0), 640);
    after.style.opacity = clamp((t - TURN_T) / 0.15);
  },
};
</script>
