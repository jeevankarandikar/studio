<!doctype html>
<!-- PREP: Point, Reason, Explain, Point restated. Delivery structure from the Mona
     (@babystepstothemic) PREP reel: one opinion, why it holds, one personal example,
     then the point again as the close. Replace the four lines below with your own.
     One sound per block, placed next to the visual it belongs to. -->
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<body>
<div id="amb"></div>
<div id="point" class="abs h1" style="left:160px;top:180px;width:1500px">Say the point.</div>
<div id="reason" class="abs sub" style="left:166px;top:430px;width:1200px">Say why it holds.</div>
<div id="ex"></div>
<div id="again" class="abs h2" style="left:160px;top:820px;width:1500px">Say the point again.</div>
<script src="common.js"></script>
<script>
const pointW = splitWords($('point'));
const reasonW = splitWords($('reason'));
const againW = splitWords($('again'));
const ex = card($('ex'), { w: 1200, h: 260, html: '<div class="sub" style="padding:40px">Show one example.</div>' });
window.scene = {
  sfx: [{ t: 0.2, name: 'pop' }, { t: 1.0, name: 'tick', gain: 0.3 }, { t: 1.8, name: 'settle' }, { t: 2.6, name: 'chime' }],
  render(t, f, ctx) {
    ambient($('amb'), t);
    wordsIn(pointW, t, { delay: 0.2, step: 0.1, rise: 110 });
    wordsIn(reasonW, t, { delay: 1.0, step: 0.08, rise: 40, preset: spring.soft });
    pos(ex, 160 + sp(t, 1.8, spring.bouncy, 600, 0), 560, `scale(${sp(t, 1.8, spring.snappy, 0.9, 1)})`);
    ex.style.opacity = clamp((t - 1.8) / 0.12);
    wordsIn(againW, t, { delay: 2.6, step: 0.1, rise: 90 });
    document.body.style.opacity = 1 - clamp(sp(t, 3.4, spring.soft));
  },
};
</script>
